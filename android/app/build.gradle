plugins {
    id 'com.android.application' version '9.0.1'
}

android {
    namespace 'app.deskglow'
    compileSdk 35

    defaultConfig {
        applicationId 'app.deskglow'
        minSdk 26
        targetSdk 35
        versionCode 22
        versionName '0.10.1'
    }
}
dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}

def apkDirectory = layout.buildDirectory.dir('outputs/apk/debug')
def versionedApk = "DeskGlow-Android-v${android.defaultConfig.versionName}.apk"
def nameDebugApk = tasks.register('nameDebugApk', Copy) {
    from(apkDirectory.map { it.file('app-debug.apk') })
    into(layout.buildDirectory.dir('outputs/dist'))
    rename { versionedApk }
}
tasks.matching { it.name == 'assembleDebug' }.configureEach {
    finalizedBy(nameDebugApk)
}
